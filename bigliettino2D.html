                    Il nostro primo bacio!
                </p>


                <!-- =================================================

                ================================================== -->

                <img
                    class="kiss-lips"

                    Le tue labbra morbide,
                    il tuo sapore,
                    la tua lingua che incontra la mia...
                </p>

                <p class="ending">
